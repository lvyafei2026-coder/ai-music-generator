<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="dashTitle">Dashboard — AI Music Generator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-dark">
<header class="header header-dark">
  <div class="header-inner">
    <a href="/" class="logo"><span class="logo-mark">T</span> toolara.dev</a>
    <nav class="header-nav">
      <a href="pricing.html" data-i18n="navPricing">Pricing</a>
      <a href="#" onclick="doLogout(); return false;" data-i18n="navSignOut">Sign Out</a>
      <select id="langSelect" class="lang-select" onchange="setLang(this.value)" aria-label="Language">
        <option value="en">English</option>
        <option value="zh">简体中文</option>
      </select>
    </nav>
  </div>
</header>

<main class="wrap no-hero">

  <!-- ========== 用量卡（紧凑版） ========== -->
  <div class="card usage-card-compact">
    <div class="usage-top">
      <div class="usage-left">
        <span class="usage-big"><span id="remainingCount">—</span> <span class="usage-big-unit" data-i18n="remainingUnit">songs</span></span>
        <span class="usage-sub" data-i18n="remainingLabel">Remaining:</span>
        <span id="usageFraction" class="usage-fraction">— / —</span>
      </div>
      <div class="usage-right">
        <span id="userEmailTop" class="user-email-top">—</span>
        <span class="usage-divider">·</span>
        <span id="proStatus" class="pro-status-inline" style="display:none;" data-i18n="proActive">✓ Pro subscription active</span>
        <span id="planBadge" class="plan-badge free" data-i18n="planFree">Free</span>
        <a href="pricing.html" class="btn-primary small" id="upgradeBtn" data-i18n="upgradeBtn">Upgrade to Pro</a>
      </div>
    </div>
    <div class="usage-bar-wrap">
      <div class="usage-bar" id="usageBar"></div>
    </div>
  </div>

  <!-- ========== 左右布局 ========== -->
  <div class="dash-grid">

    <!-- 左：创作 -->
    <div class="card create-card">
      <h2 data-i18n="createSong">Create a Song</h2>

      <label data-i18n="labelPrompt">Describe your song</label>
      <textarea id="prompt" rows="3" data-i18n-placeholder="promptPlaceholder" placeholder="An upbeat electronic dance track with female vocals about summer nights"></textarea>

      <label data-i18n="labelDuration">Duration (seconds, 10–300)</label>
      <input type="number" id="duration" min="10" max="300" step="10" value="120" inputmode="numeric">

      <label data-i18n="labelLyrics">Lyrics (optional — leave blank for AI-generated lyrics)</label>
      <textarea id="lyrics" rows="5" data-i18n-placeholder="lyricsPlaceholder" placeholder="Paste your own lyrics here, or leave blank..."></textarea>

      <div class="lyrics-tools" id="lyricsTools">
        <button type="button" class="lyrics-tool-btn" onclick="aiGenerateLyrics()">
          ✨ <span data-i18n="btnGenLyrics">Generate lyrics</span>
        </button>
        <button type="button" class="lyrics-tool-btn" onclick="aiOptimizeLyrics()">
          📝 <span data-i18n="btnOptLyrics">Improve lyrics</span>
        </button>
        <span class="lyrics-hint" id="lyricsHint"></span>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" id="instrumental"> <span data-i18n="labelInstrumental">Instrumental only (no vocals)</span>
      </label>
      <button class="calc" id="generateBtn" onclick="generate()" data-i18n="btnGenerate">Generate Song</button>
      <div id="genError" class="error" style="display:none;"></div>
      <div id="genLoading" class="loading" style="display:none;">
        <div class="spinner"></div>
        <div data-i18n="generating">Generating your song... This takes 1-3 minutes.</div>
      </div>
    </div>

    <!-- 右：歌曲列表 -->
    <div class="card songs-card">
      <div class="songs-header">
        <h2 data-i18n="yourSongs">Your Songs</h2>
        <div class="tabs" id="taskTabs">
          <button class="tab" data-tab="all" onclick="switchTaskTab('all')" data-i18n="tabAll">All</button>
          <button class="tab active" data-tab="completed" onclick="switchTaskTab('completed')" data-i18n="tabCompleted">Completed</button>
          <button class="tab" data-tab="failed" onclick="switchTaskTab('failed')" data-i18n="tabFailed">Failed</button>
        </div>
      </div>
      <div id="taskList" class="task-list"></div>
      <p id="emptyTasks" class="empty-state" data-i18n="emptyTasks">No songs yet. Create your first one above.</p>
    </div>

  </div>

</main>

<script src="js/i18n.js"></script>
<script>
var API_BASE = '/ai-music-generator';
var currentTaskId = null;
var pollInterval = null;
var currentTab = 'completed';
var allTasks = [];

function t(key, fallback) {
  return (window.__i18n && window.__i18n.t && window.__i18n.t[key]) || fallback || key;
}

async function loadUser() {
  var res = await fetch(API_BASE + '/api/auth/me');
  if (!res.ok) { window.location.href = 'login.html'; return; }
  var data = await res.json();
  var u = data.user;

  var emailEl = document.getElementById('userEmailTop');
  if (emailEl) emailEl.textContent = u.email;

  var isPro = u.plan === 'pro';
  var badge = document.getElementById('planBadge');
  badge.textContent = isPro ? t('planPro', 'Pro') : t('planFree', 'Free');
  badge.className = 'plan-badge ' + (isPro ? 'pro' : 'free');

  var used = u.generations_used || 0;
  var limit = u.generations_limit || 3;
  var remaining = Math.max(0, limit - used);

  document.getElementById('remainingCount').textContent = remaining;
  document.getElementById('usageFraction').textContent = used + ' / ' + limit;

  var pct = limit > 0 ? (used / limit * 100) : 0;
  document.getElementById('usageBar').style.width = Math.min(pct, 100) + '%';

  var proStatus = document.getElementById('proStatus');
  if (proStatus) proStatus.style.display = isPro ? 'block' : 'none';
  if (isPro) document.getElementById('upgradeBtn').style.display = 'none';

  if (remaining <= 0) {
    var btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.textContent = t('limitReached', 'Limit reached — Upgrade to Pro');
  }
}

async function generate() {
  var prompt = document.getElementById('prompt').value.trim();
  var lyrics = document.getElementById('lyrics').value.trim();
  var isInstrumental = document.getElementById('instrumental').checked;
  var duration = parseInt(document.getElementById('duration').value, 10) || 120;
  var errEl = document.getElementById('genError');
  var loadingEl = document.getElementById('genLoading');
  var btn = document.getElementById('generateBtn');

  errEl.style.display = 'none';
  if (prompt.length < 5) {
    errEl.textContent = t('errorDescribe', 'Please describe your song.');
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  loadingEl.style.display = 'flex';

  try {
    var res = await fetch(API_BASE + '/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: prompt,
        lyrics: lyrics,
        isInstrumental: isInstrumental,
        audioDuration: duration
      })
    });
    var data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || t('errorGeneration', 'Generation failed.');
      errEl.style.display = 'block';
      btn.disabled = false;
      loadingEl.style.display = 'none';
      return;
    }
    currentTaskId = data.taskId;
    pollTask(data.taskId);
  } catch (err) {
    errEl.textContent = t('errorNetwork', 'Network error. Please try again.');
    errEl.style.display = 'block';
    btn.disabled = false;
    loadingEl.style.display = 'none';
  }
}

function pollTask(taskId) {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async function () {
    var res = await fetch(API_BASE + '/api/task/' + taskId);
    var data = await res.json();
    if (data.status === 'completed') {
      clearInterval(pollInterval);
      document.getElementById('genLoading').style.display = 'none';
      document.getElementById('generateBtn').disabled = false;
      loadTasks();
      loadUser();
    } else if (data.status === 'failed') {
      clearInterval(pollInterval);
      document.getElementById('genLoading').style.display = 'none';
      document.getElementById('genError').textContent = data.error || t('errorGeneration', 'Generation failed.');
      document.getElementById('genError').style.display = 'block';
      document.getElementById('generateBtn').disabled = false;
      loadTasks();
      loadUser();
    }
  }, 5000);
}

async function loadTasks() {
  var res = await fetch(API_BASE + '/api/tasks');
  var data = await res.json();
  allTasks = data.tasks || [];
  renderTasks();
}

function switchTaskTab(tab) {
  currentTab = tab;
  document.querySelectorAll('#taskTabs .tab').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-tab') === tab);
  });
  renderTasks();
}

function statusLabel(status) {
  if (status === 'completed') return t('statusCompleted', 'Completed');
  if (status === 'generating') return t('statusGenerating', 'Generating');
  if (status === 'pending') return t('statusPending', 'Pending');
  if (status === 'failed') return t('statusFailed', 'Failed');
  return status;
}

function renderTasks() {
  var list = document.getElementById('taskList');
  var empty = document.getElementById('emptyTasks');

  var filtered = allTasks;
  if (currentTab === 'completed') {
    filtered = allTasks.filter(function (t) { return t.status === 'completed'; });
  } else if (currentTab === 'failed') {
    filtered = allTasks.filter(function (t) { return t.status === 'failed'; });
  }

  if (!filtered.length) {
    empty.style.display = 'block';
    list.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = filtered.map(function (t) {
    var url = t.audioUrl ? (API_BASE + t.audioUrl) : '';
    var retryBtn = t.status === 'failed'
      ? '<button class="retry-btn" onclick="retryTask(\'' + t.id + '\')">↻ ' + statusLabelSafe('retryBtn', 'Retry') + '</button>'
      : '';
    return '<div class="task-item">' +
      '<div class="task-info">' +
        '<div class="task-prompt">' + escapeHtml(t.prompt).slice(0, 100) + '</div>' +
        '<div class="task-status ' + t.status + '">' + statusLabel(t.status) + '</div>' +
      '</div>' +
      (url ? '<audio controls src="' + url + '"></audio>' : '') +
      retryBtn +
    '</div>';
  }).join('');
}

function statusLabelSafe(key, fallback) {
  return t(key, fallback);
}

async function retryTask(taskId) {
  var task = allTasks.find(function (t) { return t.id === taskId; });
  if (!task) return;
  var promptEl = document.getElementById('prompt');
  if (promptEl && task.prompt) {
    promptEl.value = task.prompt;
    promptEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function doLogout() {
  await fetch(API_BASE + '/api/auth/logout', { method: 'POST' });
  window.location.href = './';
}

// ---------- AI 歌词 ----------
function setLyricsHint(msg, isError) {
  var el = document.getElementById('lyricsHint');
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'lyrics-hint' + (isError ? ' lyrics-hint-error' : '');
}

function currentLang() {
  return (window.__i18n && window.__i18n.lang) === 'zh' ? 'zh' : 'en';
}

async function aiGenerateLyrics() {
  var promptEl = document.getElementById('prompt');
  var topic = promptEl ? promptEl.value.trim() : '';

  if (!topic || topic.length < 5) {
    promptEl.classList.add('input-error');
    setLyricsHint(t('lyricsPromptEmpty', 'Please describe your song first.'), true);
    promptEl.focus();
    setTimeout(function () { promptEl.classList.remove('input-error'); }, 2000);
    return;
  }

  var btn = event && event.target;
  if (btn) btn.disabled = true;
  setLyricsHint(t('lyricsGenerating', 'Generating...'));

  try {
    var res = await fetch(API_BASE + '/api/lyrics', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'generate', topic: topic, language: currentLang() })
    });
    var data = await res.json();
    if (!res.ok) {
      setLyricsHint(data.error || t('lyricsFailed', 'Failed. Please try again.'), true);
      return;
    }
    document.getElementById('lyrics').value = data.lyrics;
    setLyricsHint(t('lyricsDone', 'Done. Feel free to edit.'));
  } catch (e) {
    setLyricsHint(t('errorNetwork', 'Network error.'), true);
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function aiOptimizeLyrics() {
  var current = document.getElementById('lyrics').value.trim();
  if (!current) {
    setLyricsHint(t('lyricsEmpty', 'Please write some lyrics first.'), true);
    return;
  }
  var btn = event && event.target;
  if (btn) btn.disabled = true;
  setLyricsHint(t('lyricsOptimizing', 'Improving...'));

  try {
    var res = await fetch(API_BASE + '/api/lyrics', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'optimize', lyrics: current, language: currentLang() })
    });
    var data = await res.json();
    if (!res.ok) {
      setLyricsHint(data.error || t('lyricsFailed', 'Failed. Please try again.'), true);
      return;
    }
    document.getElementById('lyrics').value = data.lyrics;
    setLyricsHint(t('lyricsDone', 'Done. Feel free to edit.'));
  } catch (e) {
    setLyricsHint(t('errorNetwork', 'Network error.'), true);
  } finally {
    if (btn) btn.disabled = false;
  }
}

document.addEventListener('i18n-ready', function () {
  var params = new URLSearchParams(window.location.search);
  var promptParam = params.get('prompt');
  if (promptParam) {
    var promptEl = document.getElementById('prompt');
    if (promptEl) promptEl.value = promptParam;
  }
  loadUser();
  loadTasks();
});

if (new URLSearchParams(window.location.search).get('success') === 'true') {
  setTimeout(function () {
    alert(t('paymentSuccess', 'Payment successful! Your Pro subscription is now active.'));
    window.history.replaceState({}, '', 'dashboard.html');
  }, 500);
}
</script>
</body>
</html>
