<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email — AI Music Generator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="./" class="logo"><span class="logo-mark">T</span> toolara.dev</a>
  </div>
</header>

<main class="wrap narrow no-hero">
  <div class="card" style="text-align:center;">
    <div id="loading" style="padding:40px 0;">
      <div class="spinner" style="margin:0 auto 16px;"></div>
      <p>Verifying your email...</p>
    </div>
    <div id="success" style="display:none;">
      <h2 style="color:#059669;">✓ Email verified</h2>
      <p>Your account is now active.</p>
      <a href="login.html" class="btn-primary small" style="margin-top:16px;">Sign in</a>
    </div>
    <div id="error" style="display:none;">
      <h2 style="color:#dc2626;">Verification failed</h2>
      <p id="errorMsg">This link is invalid or has expired.</p>
      <a href="login.html" class="btn-secondary" style="margin-top:16px; color:#0f766e; border-color:#0f766e;">Back to sign in</a>
    </div>
  </div>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (!token) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'block';
  document.getElementById('errorMsg').textContent = 'Missing verification token.';
} else {
  fetch('api/auth/verify-email?token=' + token)
    .then(r => r.json())
    .then(data => {
      document.getElementById('loading').style.display = 'none';
      if (data.success) {
        document.getElementById('success').style.display = 'block';
      } else {
        document.getElementById('error').style.display = 'block';
        document.getElementById('errorMsg').textContent = data.error || 'Verification failed.';
      }
    })
    .catch(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('errorMsg').textContent = 'Network error. Please try again.';
    });
}
</script>
</body>
</html>
