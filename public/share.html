<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="shareTitle">A song made with AI</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a855f7">
</head>
<body class="page-dark">

<header class="header header-dark">
  <div class="header-inner">
    <a href="/music/" class="logo"><span class="logo-mark">T</span> toolara.dev</a>
    <nav class="header-nav">
      <a href="/music/" data-i18n="navHome">Home</a>
      <select id="langSelect" class="lang-select" onchange="setLang(this.value)" aria-label="Language">
        <option value="en">English</option>
        <option value="zh">简体中文</option>
      </select>
    </nav>
  </div>
</header>

<main class="share-wrap">
  <div id="loading" class="share-loading">
    <div class="spinner"></div>
  </div>

  <div id="error" class="share-error" style="display:none;">
    <p id="errorMsg">This song is not available.</p>
    <a href="/music/" class="btn-accent" data-i18n="shareTryIt">Try it yourself</a>
  </div>

  <div id="content" style="display:none;">
    <div class="share-card">
      <div class="share-cover">
        <span id="shareEmoji">🎵</span>
      </div>

      <h1 class="share-title" id="shareTitle">A song made with AI</h1>
      <p class="share-subtitle" data-i18n="shareSubtitle">Generated from a single sentence.</p>

      <div class="share-tags">
        <span class="share-tag" id="shareTag">With vocals</span>
        <span class="share-tag share-tag-muted" id="shareDuration">—</span>
      </div>

      <audio id="shareAudio" controls preload="metadata" style="width:100%; margin: 20px 0;"></audio>

      <div class="share-section">
        <h3 data-i18n="sharePrompt">Prompt</h3>
        <p id="sharePrompt"></p>
      </div>

      <div class="share-section" id="lyricsSection" style="display:none;">
        <h3 data-i18n="shareLyrics">Lyrics</h3>
        <pre id="shareLyrics" class="share-lyrics"></pre>
      </div>

      <div class="share-footer">
        <a href="/music/" class="btn-accent" data-i18n="shareTryIt">Try it yourself</a>
      </div>
    </div>
  </div>
</main>

<footer class="footer footer-dark">
  <p><span data-i18n="sharePoweredBy">Made with AI Music Generator</span> · <a href="/music/">toolara.dev</a></p>
</footer>

<script src="/js/i18n.js"></script>
<script>
function t(k, fb) { return (window.__i18n && window.__i18n.t && window.__i18n.t[k]) || fb || k; }

function init() {
  // 从 URL /music/share/<taskId> 取 taskId
  var parts = window.location.pathname.split('/').filter(Boolean);
  // 期望 ['music','share','<taskId>']
  var taskId = parts[parts.length - 1];
  if (!taskId || parts[parts.length - 2] !== 'share') {
    showError('Invalid share link');
    return;
  }

  fetch('/music/api/share/' + encodeURIComponent(taskId))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) { showError(data.error); return; }
      renderSong(data);
    })
    .catch(function () { showError('Network error'); });
}

function renderSong(d) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  document.getElementById('shareTitle').textContent = d.prompt || t('shareTitle', 'A song made with AI');
  document.getElementById('shareTag').textContent = d.isInstrumental ? t('demoInstrumental', 'Instrumental') : t('demoVocal', 'With vocals');
  document.getElementById('shareTag').className = 'share-tag';

  if (d.duration) {
    document.getElementById('shareDuration').textContent = d.duration + 's';
  } else {
    document.getElementById('shareDuration').style.display = 'none';
  }

  document.getElementById('shareEmoji').textContent = d.isInstrumental ? '🎹' : '🎤';
  document.getElementById('shareAudio').src = d.audioUrl;
  document.getElementById('sharePrompt').textContent = d.prompt || '—';

  if (d.lyrics && d.lyrics.trim()) {
    document.getElementById('lyricsSection').style.display = 'block';
    document.getElementById('shareLyrics').textContent = d.lyrics;
  }
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'block';
  document.getElementById('errorMsg').textContent = msg || 'This song is not available.';
}

document.addEventListener('i18n-ready', init);
</script>
</body>
</html>
