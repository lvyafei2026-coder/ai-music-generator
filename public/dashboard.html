<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — AI Music Generator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="/" class="logo"><span class="logo-mark">T</span> toolara.dev</a>
    <nav class="header-nav">
      <a href="pricing.html">Pricing</a>
      <a href="#" onclick="doLogout()">Sign Out</a>
    </nav>
  </div>
</header>

<main class="wrap no-hero">
  <div class="card user-card">
    <p>Signed in as: <strong id="userEmail">—</strong></p>
    <p id="proStatus" style="display:none; color:#059669; font-weight:600;">✓ Pro subscription active</p>
  </div>
  <div class="card usage-card">
    <div class="usage-header">
      <h2>Your Plan</h2>
      <span id="planBadge" class="plan-badge free">Free</span>
    </div>
    <div class="usage-bar-wrap">
      <div class="usage-bar" id="usageBar"></div>
    </div>
    <p class="usage-text" id="usageText">0 / 3 generations used this month</p>
    <a href="pricing.html" class="btn-primary small" id="upgradeBtn">Upgrade to Pro</a>
  </div>

  <div class="card">
    <h2>Create a Song</h2>
    <label>Describe your song</label>
    <textarea id="prompt" rows="3" placeholder="An upbeat electronic dance track with female vocals about summer nights"></textarea>
    <label>Duration (seconds, 10–300)</label>
    <input type="number" id="duration" min="10" max="300" step="10" value="120" inputmode="numeric">
    <label>Lyrics (optional — leave blank for AI-generated lyrics)</label>
    <textarea id="lyrics" rows="4" placeholder="Paste your own lyrics here, or leave blank..."></textarea>
    <label class="checkbox-label">
      <input type="checkbox" id="instrumental"> Instrumental only (no vocals)
    </label>
    <button class="calc" id="generateBtn" onclick="generate()">Generate Song</button>
    <div id="genError" class="error" style="display:none;"></div>
    <div id="genLoading" class="loading" style="display:none;">
      <div class="spinner"></div>
      <div>Generating your song... This takes 1-3 minutes.</div>
    </div>
  </div>

  <div class="card">
    <h2>Your Songs</h2>
    <div id="taskList" class="task-list"></div>
    <p id="emptyTasks" class="empty-state">No songs yet. Create your first one above.</p>
  </div>
</main>

<script>
let currentTaskId = null;
let pollInterval = null;

async function loadUser() {
  const res = await fetch('api/auth/me');
  if (!res.ok) { window.location.href = 'login.html'; return; }
  const data = await res.json();
  const u = data.user;

  // 显示邮箱
  const emailEl = document.getElementById('userEmail');
  if (emailEl) emailEl.textContent = u.email;

  // 显示套餐
  const isPro = u.plan === 'pro';
  const badge = document.getElementById('planBadge');
  badge.textContent = isPro ? 'Pro' : 'Free';
  badge.className = 'plan-badge ' + (isPro ? 'pro' : 'free');

  // 用量进度（修复了模板字符串的语法错误）
  const pct = u.generations_limit > 0 ? (u.generations_used / u.generations_limit * 100) : 0;
  document.getElementById('usageBar').style.width = Math.min(pct, 100) + '%';
  document.getElementById('usageText').textContent = 
    u.generations_used + ' / ' + u.generations_limit + ' generations used this month';

  // 订阅状态
  const proStatus = document.getElementById('proStatus');
  if (proStatus) {
    proStatus.style.display = isPro ? 'block' : 'none';
  }
  if (isPro) {
    document.getElementById('upgradeBtn').style.display = 'none';
  }

  // 用量到达上限
  if (u.generations_used >= u.generations_limit) {
    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.textContent = 'Limit reached — Upgrade to Pro';
  }
}

async function generate() {
  const prompt = document.getElementById('prompt').value.trim();
  const lyrics = document.getElementById('lyrics').value.trim();
  const isInstrumental = document.getElementById('instrumental').checked;
  const errEl = document.getElementById('genError');
  const loadingEl = document.getElementById('genLoading');
  const btn = document.getElementById('generateBtn');

  errEl.style.display = 'none';
  if (prompt.length < 5) { errEl.textContent = 'Please describe your song.'; errEl.style.display = 'block'; return; }

  btn.disabled = true;
  loadingEl.style.display = 'flex';

  try {
    const res = await fetch('api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt,
        lyrics,
        isInstrumental,
        audioDuration: parseInt(document.getElementById('duration').value, 10) || 120
      })
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Generation failed.';
      errEl.style.display = 'block';
      btn.disabled = false;
      loadingEl.style.display = 'none';
      return;
    }

    currentTaskId = data.taskId;
    pollTask(data.taskId);
  } catch (err) {
    errEl.textContent = 'Network error. Please try again.';
    errEl.style.display = 'block';
    btn.disabled = false;
    loadingEl.style.display = 'none';
  }
}

function pollTask(taskId) {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    const res = await fetch('api/task/' + taskId);
    const data = await res.json();
    if (data.status === 'completed') {
      clearInterval(pollInterval);
      document.getElementById('genLoading').style.display = 'none';
      document.getElementById('generateBtn').disabled = false;
      loadTasks();
      loadUser();
    } else if (data.status === 'failed') {
      clearInterval(pollInterval);
      document.getElementById('genLoading').style.display = 'none';
      document.getElementById('genError').textContent = data.error || 'Generation failed.';
      document.getElementById('genError').style.display = 'block';
      document.getElementById('generateBtn').disabled = false;
    }
  }, 5000);
}

async function loadTasks() {
  const res = await fetch('api/tasks');
  const data = await res.json();
  const list = document.getElementById('taskList');
  const empty = document.getElementById('emptyTasks');
  if (!data.tasks || data.tasks.length === 0) {
    empty.style.display = 'block';
    list.innerHTML = '';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = data.tasks.map(t => `
    <div class="task-item">
      <div class="task-info">
        <div class="task-prompt">${escapeHtml(t.prompt).slice(0, 100)}</div>
        <div class="task-status ${t.status}">${t.status}</div>
      </div>
      ${t.audioUrl ? `<audio controls src="${t.audioUrl}"></audio>` : ''}
    </div>
  `).join('');
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function doLogout() {
  await fetch('api/auth/logout', { method: 'POST' });
  window.location.href = './';
}

loadUser();
loadTasks();

// 处理支付成功返回
if (new URLSearchParams(window.location.search).get('success') === 'true') {
  alert('Payment successful! Your Pro subscription is now active.');
  // 清理 URL 参数，避免刷新时重复提示
  window.history.replaceState({}, '', 'dashboard.html');
}
</script>
</body>
</html>
