<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="loginTitle">Sign In — AI Music Generator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="/" class="logo"><span class="logo-mark">T</span> toolara.dev</a>
    <nav class="header-nav">
      <select id="langSelect" class="lang-select" onchange="setLang(this.value)" aria-label="Language">
        <option value="en">English</option>
        <option value="zh">简体中文</option>
      </select>
    </nav>
  </div>
</header>

<main class="wrap narrow no-hero">
  <div class="card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login', event)" data-i18n="tabLogin">Sign In</button>
      <button class="auth-tab" id="tabSignup" onclick="switchTab('signup', event)" data-i18n="tabSignup">Sign Up</button>
    </div>

    <div id="loginForm">
      <label data-i18n="labelEmail">Email</label>
      <input type="email" id="loginEmail" data-i18n-placeholder="placeholderEmail" placeholder="you@example.com">
      <label data-i18n="labelPassword">Password</label>
      <input type="password" id="loginPassword" data-i18n-placeholder="placeholderPassword" placeholder="••••••••">
      <button class="calc" id="btnLogin" onclick="doLogin()" data-i18n="btnLogin">Sign In</button>
      <div id="loginError" class="error" style="display:none;"></div>
    </div>

    <div id="signupForm" style="display:none;">
      <label data-i18n="labelEmail">Email</label>
      <input type="email" id="signupEmail" data-i18n-placeholder="placeholderEmail" placeholder="you@example.com">
      <label data-i18n="labelPassword">Password</label>
      <input type="password" id="signupPassword" data-i18n-placeholder="placeholderPasswordSignup" placeholder="At least 8 characters">
      <button class="calc" id="btnSignup" onclick="doSignup()" data-i18n="btnSignup">Create Account</button>
      <div id="signupError" class="error" style="display:none;"></div>
    </div>
  </div>
</main>

<script src="js/i18n.js"></script>
<script>
function t(key, fallback) {
  return (window.__i18n && window.__i18n.t && window.__i18n.t[key]) || fallback || key;
}

function switchTab(tab, ev) {
  document.querySelectorAll('.auth-tab').forEach(function (t) { t.classList.remove('active'); });
  if (ev && ev.target) ev.target.classList.add('active');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
}

async function doLogin() {
  var email = document.getElementById('loginEmail').value;
  var password = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  var res = await fetch('api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: password })
  });
  var data = await res.json();

  if (res.ok) {
    window.location.href = 'dashboard.html';
  } else if (data.code === 'EMAIL_NOT_VERIFIED') {
    errEl.innerHTML = t('emailNotVerified', 'Please verify your email first.') +
      ' <a href="#" onclick="resendVerification(\'' + email + '\'); return false;">' +
      t('resendVerification', 'Resend verification email') + '</a>';
    errEl.style.display = 'block';
  } else {
    errEl.textContent = data.error || t('errorLoginFailed', 'Login failed.');
    errEl.style.display = 'block';
  }
}

async function resendVerification(email) {
  var res = await fetch('api/auth/resend-verification', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  });
  var data = await res.json();
  alert(data.message || 'Verification email resent.');
}

async function doSignup() {
  var email = document.getElementById('signupEmail').value;
  var password = document.getElementById('signupPassword').value;
  var errEl = document.getElementById('signupError');
  errEl.style.display = 'none';

  var res = await fetch('api/auth/signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: password })
  });
  var data = await res.json();

  if (res.ok && data.requiresVerification) {
    document.getElementById('signupForm').innerHTML =
      '<div style="text-align:center; padding: 20px;">' +
        '<h3>' + t('signupSuccessTitle', 'Check your email') + '</h3>' +
        '<p>' + t('signupSuccessBody1', "We've sent a verification link to") + ' <strong>' + email + '</strong>.</p>' +
        '<p>' + t('signupSuccessBody2', 'Click the link in the email to activate your account.') + '</p>' +
      '</div>';
  } else {
    errEl.textContent = data.error || t('errorSignupFailed', 'Registration failed.');
    errEl.style.display = 'block';
  }
}
</script>
</body>
</html>
